[package]
name = "xox"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
exclude = [
    ".agents",
    ".git",
    ".github",
    ".venv",
    ".pytest_cache",
    "target",
    "tests",
    "docs",
]

[lib]
name = "xox"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
